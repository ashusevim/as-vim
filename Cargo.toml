[package]
name = "as-vim"
version = "0.4.0"
edition = "2021"
description = "A minimal, fast, vim-inspired terminal text editor in a single static binary"
license = "MIT"
repository = "https://github.com/ashusevim/as-vim"
readme = "README.md"
keywords = ["editor", "tui", "vim", "terminal", "cli"]
categories = ["command-line-utilities", "text-editors"]

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
