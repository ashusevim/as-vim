name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        run: |
          # musl cross builds have no external cross-linker on the runners;
          # rust-lld + self-contained musl objects link fully static binaries.
          if [[ "${{ matrix.target }}" == *-musl ]]; then
            export RUSTFLAGS="-C linker=rust-lld -C link-self-contained=yes"
          fi
          cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="${{ matrix.target }}"
          NAME="as-vim-${VERSION}-${TARGET}"
          mkdir "$NAME"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/${TARGET}/release/as-vim.exe" "$NAME/"
            cp README.md LICENSE "$NAME/"
            7z a "${NAME}.zip" "$NAME"
          else
            cp "target/${TARGET}/release/as-vim" "$NAME/"
            cp README.md LICENSE "$NAME/"
            tar czf "${NAME}.tar.gz" "$NAME"
          fi
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: as-vim-*
